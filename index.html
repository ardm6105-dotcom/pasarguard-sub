<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ user.username }}</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1020;--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--text:#f3f5ff;--mute:#a3afd6;--in:rgba(0,0,0,.25);--btn:rgba(255,255,255,.1);--track:rgba(255,255,255,.08);--blob:.45;--gold:#ffb020;--red:#ff4d5e;--teal:#2de2c0;--ok:#3ddc97;--bad:#ff6b6b}
[data-theme=light]{--bg:#eef1fa;--glass:rgba(255,255,255,.72);--line:rgba(20,30,70,.12);--text:#111936;--mute:#58648f;--in:rgba(20,30,70,.06);--btn:rgba(20,30,70,.08);--track:rgba(20,30,70,.1);--blob:.25;--ok:#12a36a;--bad:#d93a3a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:18px 16px 48px;display:flex;justify-content:center;overflow-x:hidden;transition:background .3s}
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(80px);opacity:var(--blob);animation:drift 18s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:340px;height:340px;background:var(--red);top:-80px;right:-60px}
.aurora i:nth-child(2){width:320px;height:320px;background:var(--gold);bottom:-60px;left:-80px;animation-delay:-6s}
.aurora i:nth-child(3){width:260px;height:260px;background:#5b5bff;top:45%;left:30%;animation-delay:-11s}
@keyframes drift{to{transform:translate(40px,-50px) scale(1.15)}}
main{width:100%;max-width:460px;display:grid;gap:14px;align-content:start}
.card{background:var(--glass);border:1px solid var(--line);border-radius:26px;padding:22px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.tools{display:flex;gap:8px;justify-content:flex-end}
.tools button{background:var(--glass);border:1px solid var(--line);color:var(--text);padding:8px 14px;font-size:13px;backdrop-filter:blur(12px)}
header{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;flex:none;border-radius:15px;background:linear-gradient(135deg,var(--red),var(--gold));display:grid;place-items:center;font-size:20px;font-weight:800;color:#fff;box-shadow:0 8px 24px rgba(255,77,94,.35)}
header h1{font-size:17px;font-weight:800;line-height:1.3}
header small{color:var(--mute);font-size:12px}
.badge{margin-inline-start:auto;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:6px 12px;border-radius:99px;background:rgba(61,220,151,.14);color:var(--ok);white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.8s infinite}
.badge.bad{background:rgba(255,107,107,.14);color:var(--bad)}
@keyframes pulse{50%{opacity:.25;transform:scale(1.5)}}
.gauge{display:grid;place-items:center;position:relative;margin:4px 0 6px}
.gauge svg{width:230px;height:230px;transform:rotate(-90deg);filter:drop-shadow(0 0 14px rgba(255,176,32,.3))}
.gauge circle{fill:none;stroke-width:15;stroke-linecap:round}
.gauge .bg{stroke:var(--track)}
.gauge .fg{stroke:url(#g);stroke-dasharray:565;stroke-dashoffset:565;transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1)}
.mid{position:absolute;text-align:center}
.mid b{font-size:34px;font-weight:900;display:block;direction:ltr;line-height:1.2}
.mid span{font-size:12px;color:var(--mute)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:var(--in);border-radius:16px;padding:12px;text-align:center}
.stat span{display:block;font-size:11.5px;color:var(--mute);margin-bottom:3px}
.stat b{font-size:14px}
.stat b.on{color:var(--ok)}
.bar{height:8px;border-radius:9px;background:var(--track);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--gold));transition:width 1.6s cubic-bezier(.2,.8,.2,1)}
.barlbl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);margin-top:6px}
h2{font-size:14px;font-weight:800;margin-bottom:14px}
h2 small{color:var(--mute);font-weight:400}
button,.btn{font-family:inherit;cursor:pointer;border:0;border-radius:14px;font-weight:700;font-size:14px;text-decoration:none;transition:transform .15s}
button:active,.btn:active{transform:scale(.96)}
.link{display:flex;gap:8px;align-items:center;background:var(--in);border:1px solid var(--line);border-radius:16px;padding:6px;padding-inline-start:14px}
.link input{flex:1;min-width:0;background:none;border:0;color:var(--mute);font-size:12px;direction:ltr;outline:none}
.copy{background:linear-gradient(135deg,var(--gold),#ff8a1f);color:#2a1600;padding:11px 20px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--in);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{background:none;color:var(--mute);padding:10px 0}
.tabs button.on{background:var(--btn);color:var(--text)}
.pane{display:none;gap:10px}.pane.on{display:grid}
.app{display:flex;align-items:center;gap:10px;background:var(--in);border-radius:16px;padding:12px}
.app div{flex:1;min-width:0}.app b{font-size:14px;display:block}.app small{font-size:11.5px;color:var(--mute)}
.btn{background:var(--btn);color:var(--text);padding:9px 13px;font-size:12.5px}
.btn.go{background:linear-gradient(135deg,var(--teal),#19b9d6);color:#03242b}
.steps{display:grid;gap:12px;counter-reset:s}
.steps p{display:flex;gap:12px;align-items:flex-start;font-size:13.5px;line-height:1.9;color:var(--mute)}
.steps p::before{counter-increment:s;content:counter(s);flex:none;width:26px;height:26px;border-radius:9px;background:rgba(255,176,32,.15);color:var(--gold);display:grid;place-items:center;font-weight:800;font-size:13px}
.grp{background:var(--in);border-radius:18px;padding:4px 10px}
.grp+.grp{margin-top:8px}
.grp summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;padding:10px 2px;font-weight:700;font-size:14px}
.grp summary .f{font-size:24px}
.grp summary em{font-style:normal;margin-inline-start:auto;font-size:12px;color:var(--mute)}
.loc{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.loc .n{flex:1;font-size:13.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loc em{font-style:normal;font-size:10.5px;color:var(--mute);background:var(--btn);padding:3px 8px;border-radius:99px;direction:ltr}
.loc button{background:var(--btn);color:var(--text);padding:8px 12px;font-size:12px}
.lqr{background:#fff;border-radius:14px;padding:10px;width:fit-content;margin:4px auto 10px;color:#333;font-size:12px}
#qr{background:#fff;border-radius:16px;padding:12px;width:fit-content;margin:16px auto 0}
details.q summary{cursor:pointer;font-weight:700;font-size:13.5px;margin-top:14px;color:var(--mute)}
.note{display:block;text-align:center;font-size:13px;line-height:1.9;color:var(--text);text-decoration:none;background:rgba(255,176,32,.14);border-color:rgba(255,176,32,.4);padding:14px 18px}
.note[hidden]{display:none}
.support{display:block;text-align:center;background:linear-gradient(135deg,var(--red),#ff7a45);color:#fff;padding:15px;font-size:15px;border-radius:18px;box-shadow:0 10px 28px rgba(255,77,94,.3)}
footer{text-align:center;font-size:11.5px;color:var(--mute)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>
<main>
  <div class="tools"><button id="lang"></button><button id="theme"></button></div>
  <a class="card note" id="note" target="_blank" hidden></a>

  <header class="card">
    <div class="logo" id="logo"></div>
    <div><h1 id="brand"></h1></div>
    <span class="badge" id="status"></span>
  </header>

  <section class="card">
    <div class="gauge">
      <svg viewBox="0 0 200 200"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2de2c0"/><stop offset="1" stop-color="#ffb020"/></linearGradient></defs>
      <circle class="bg" cx="100" cy="100" r="90"/><circle class="fg" id="ring" cx="100" cy="100" r="90"/></svg>
      <div class="mid"><b id="left">—</b><span id="leftLabel"></span></div>
    </div>
    <div class="stats">
      <div class="stat"><span data-i="used"></span><b id="used">—</b></div>
      <div class="stat"><span data-i="total"></span><b id="total">—</b></div>
      <div class="stat"><span data-i="days"></span><b id="days">—</b></div>
      <div class="stat"><span data-i="exp"></span><b id="exp">—</b></div>
      <div class="stat"><span data-i="seen"></span><b id="seen">—</b></div>
      <div class="stat"><span data-i="upd"></span><b id="subupd">—</b></div>
    </div>
    <div class="bar"><i id="dbar"></i></div>
    <div class="barlbl"><span data-i="elapsed"></span><span id="dpct"></span></div>
  </section>

  <section class="card">
    <h2 data-i="sub"></h2>
    <div class="link"><input id="sub" readonly value="{{ user.subscription_url }}"><button class="copy" id="copyBtn"></button></div>
    <details class="q"><summary data-i="qr"></summary><div id="qr"></div></details>
  </section>

  <section class="card">
    <h2><span data-i="locs"></span> <small id="locN"></small></h2>
    <div id="locs"></div>
  </section>

  <section class="card">
    <h2 data-i="dl"></h2>
    <div class="tabs"><button data-t="and" data-i="and"></button><button data-t="ios" data-i="ios"></button><button data-t="pc" data-i="pc"></button></div>
    <div class="pane" id="and">
      <div class="app"><div><b>Hiddify</b><small data-i="n1"></small></div><a class="btn" href="https://play.google.com/store/apps/details?id=app.hiddify.com" target="_blank" data-i="get"></a><a class="btn go" id="h1" data-i="add"></a></div>
      <div class="app"><div><b>v2rayNG</b><small data-i="n2"></small></div><a class="btn" href="https://github.com/2dust/v2rayNG/releases" target="_blank" data-i="get"></a><a class="btn go" id="v1" data-i="add"></a></div>
    </div>
    <div class="pane" id="ios">
      <div class="app"><div><b>Streisand</b><small data-i="n3"></small></div><a class="btn" href="https://apps.apple.com/app/streisand/id6450534064" target="_blank" data-i="get"></a><a class="btn go" id="s1" data-i="add"></a></div>
      <div class="app"><div><b>Hiddify</b><small data-i="n4"></small></div><a class="btn" href="https://apps.apple.com/app/hiddify-proxy-vpn/id6596777532" target="_blank" data-i="get"></a><a class="btn go" id="h2" data-i="add"></a></div>
    </div>
    <div class="pane" id="pc">
      <div class="app"><div><b>Hiddify</b><small data-i="n5"></small></div><a class="btn" href="https://github.com/hiddify/hiddify-app/releases" target="_blank" data-i="get"></a><a class="btn go" id="h3" data-i="add"></a></div>
    </div>
  </section>

  <section class="card">
    <h2 data-i="guide"></h2>
    <div class="steps"><p data-i="s1"></p><p data-i="s2"></p><p data-i="s3"></p></div>
  </section>

  <a class="btn support" id="support" target="_blank" data-i="support"></a>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
  /* ===== تنظیمات / Settings ===== */
  var USER = "{{ user.username }}";
  var SUPPORT = "";   // اختیاری. خالی باشد از تنظیمات پنل خوانده می‌شود، وگرنه دکمه پنهان است
  /* =============================== */
  var T = {
    fa:{st_active:'فعال',st_disabled:'غیرفعال',st_limited:'حجم تمام شده',st_expired:'منقضی',st_on_hold:'در انتظار',
      left:'حجم باقی‌مانده',unl:'حجم نامحدود',unlv:'نامحدود',used:'مصرف‌شده',total:'حجم کل',days:'روز باقی‌مانده',exp:'تاریخ انقضا',
      seen:'آخرین اتصال',upd:'آخرین آپدیت اشتراک',online:'آنلاین',never:'هنوز نه',elapsed:'زمان سپری‌شده',ended:'تمام شده',dayu:'روز',
      sub:'لینک اشتراک',copy:'کپی',copied:'کپی شد ✓',qr:'نمایش QR کد',locs:'لوکیشن‌های موجود',noloc:'فعلاً لوکیشنی برای این اشتراک فعال نیست.',
      other:'سایر',server:'سرور',qrbtn:'QR',qrfail:'لینک برای QR خیلی بلنده',dl:'دانلود و اتصال',and:'اندروید',ios:'آیفون',pc:'کامپیوتر',
      get:'دانلود',add:'افزودن',n1:'پیشنهادی، ساده و سریع',n2:'سبک و محبوب',n3:'پیشنهادی برای آیفون',n4:'نسخه iOS',n5:'ویندوز، مک و لینوکس',
      guide:'آموزش سریع',s1:'برنامه‌ی بالا رو نصب کن.',s2:'دکمه‌ی «افزودن» رو بزن تا لینک اشتراک خودکار وارد برنامه بشه. اگه نشد، لینک رو کپی کن و تو برنامه «افزودن از کلیپ‌بورد» رو بزن.',
      s3:'یه لوکیشن انتخاب کن و دکمه‌ی اتصال رو بزن.',support:'💬 پشتیبانی',
      ago_s:'لحظاتی پیش',ago_m:' دقیقه پیش',ago_h:' ساعت پیش',ago_d:' روز پیش',other_lang:'English'},
    en:{st_active:'Active',st_disabled:'Disabled',st_limited:'Data used up',st_expired:'Expired',st_on_hold:'On hold',
      left:'Data remaining',unl:'Unlimited data',unlv:'Unlimited',used:'Used',total:'Total',days:'Days left',exp:'Expires on',
      seen:'Last seen',upd:'Last sub update',online:'Online',never:'Not yet',elapsed:'Time elapsed',ended:'Ended',dayu:'days',
      sub:'Subscription link',copy:'Copy',copied:'Copied ✓',qr:'Show QR code',locs:'Available locations',noloc:'No active locations for this subscription.',
      other:'Other',server:'Server',qrbtn:'QR',qrfail:'Link is too long for a QR code',dl:'Download & connect',and:'Android',ios:'iPhone',pc:'Desktop',
      get:'Get',add:'Add',n1:'Recommended, simple & fast',n2:'Light & popular',n3:'Best for iPhone',n4:'iOS version',n5:'Windows, Mac & Linux',
      guide:'Quick guide',s1:'Install the app above.',s2:'Tap "Add" to import your subscription automatically. If that fails, copy the link and use "Add from clipboard" in the app.',
      s3:'Pick a location and tap connect.',support:'💬 Support',
      ago_s:'just now',ago_m:' min ago',ago_h:' h ago',ago_d:' d ago',other_lang:'فارسی'}
  };
  var $ = function(id){return document.getElementById(id)};
  var html = document.documentElement;
  var lang = 'fa', theme = null;
  try{ lang = localStorage.getItem('sl') || 'fa'; theme = localStorage.getItem('st'); }catch(e){}
  if(!T[lang]) lang = 'fa';
  if(!theme) theme = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  var t = function(k){return T[lang][k]};
  var nf = function(x){ x=String(x); return lang==='fa' ? x.replace(/\d/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'[d]}) : x; };
  var fmt = function(b){
    if(b<=0) return nf(0)+' B';
    var u=['B','KB','MB','GB','TB'],i=Math.min(Math.floor(Math.log(b)/Math.log(1024)),4);
    return nf((b/Math.pow(1024,i)).toFixed(i>1?2:0))+' '+u[i];
  };
  function pdate(v){
    if(v==null || v==='' || v==='None' || v==='0') return null;
    v = String(v);
    if(/^\d+$/.test(v)){ var n = Number(v); return n<1e11 ? n*1000 : n; }
    if(/^\d{4}-\d\d-\d\d[ T]/.test(v) && !/(Z|[+-]\d\d:?\d\d)$/.test(v)) v = v.replace(' ','T')+'Z';
    var d = Date.parse(v); return isNaN(d) ? null : d;
  }
  function ago(ts){
    var s = Math.max(0,(Date.now()-ts)/1000);
    if(s<90) return t('ago_s');
    if(s<3600) return nf(Math.round(s/60))+t('ago_m');
    if(s<86400) return nf(Math.round(s/3600))+t('ago_h');
    return nf(Math.round(s/86400))+t('ago_d');
  }
  var S = {
    used:Number("{{ user.used_traffic or 0 }}")||0,
    limit:Number("{{ user.data_limit or 0 }}")||0,
    expire:"{{ user.expire or '' }}",
    status:("{{ user.status }}").toLowerCase(),
    online:"{{ user.online_at or '' }}",
    subupd:"{{ user.sub_updated_at or '' }}",
    links:{{ (user.links or []) | tojson }}
  };
  var url = $('sub').value;

  function render(){
    var keys = ['active','disabled','limited','expired','on_hold'];
    var key = keys.filter(function(k){return S.status.indexOf(k)>-1})[0] || 'active';
    $('status').textContent = t('st_'+key);
    $('status').className = 'badge' + ((key!=='active' && key!=='on_hold') ? ' bad' : '');
    $('brand').textContent = USER; $('logo').textContent = USER.charAt(0).toUpperCase();

    $('used').textContent = fmt(S.used);
    var ring = $('ring'); ring.style.stroke = '';
    if(S.limit>0){
      var p = Math.min(S.used/S.limit,1);
      $('total').textContent = fmt(S.limit);
      $('left').textContent = fmt(Math.max(S.limit-S.used,0));
      $('leftLabel').textContent = t('left');
      setTimeout(function(){ ring.style.strokeDashoffset = 565*p; },150);
      if(p>0.9) ring.style.stroke = 'var(--bad)';
    } else {
      $('total').textContent = t('unlv'); $('left').textContent = '∞';
      $('leftLabel').textContent = t('unl'); ring.style.strokeDashoffset = 0;
    }

    var ex = pdate(S.expire), barBox = $('dbar').parentNode, lbl = $('dpct').parentNode;
    if(ex){
      var d = Math.ceil((ex-Date.now())/86400000);
      $('days').textContent = d>0 ? nf(d)+' '+t('dayu') : t('ended');
      $('exp').textContent = new Date(ex).toLocaleDateString(lang==='fa'?'fa-IR':'en-GB');
      var pct = Math.max(0,Math.min(100,100-(d/30)*100));
      setTimeout(function(){ $('dbar').style.width = pct+'%'; },150);
      $('dpct').textContent = nf(Math.round(pct))+(lang==='fa'?'٪':'%');
      barBox.style.display = lbl.style.display = '';
    } else {
      $('days').textContent = t('unlv'); $('exp').textContent = '—';
      barBox.style.display = lbl.style.display = 'none';
    }

    var on = pdate(S.online), seen = $('seen');
    if(on && (Date.now()-on) < 120000){ seen.textContent = t('online'); seen.className = 'on'; }
    else { seen.textContent = on ? ago(on) : t('never'); seen.className = ''; }
    var su = pdate(S.subupd); $('subupd').textContent = su ? ago(su) : t('never');
    $('copyBtn').textContent = t('copy');
    renderLocs(S.links);
  }

  function applyLang(){
    html.lang = lang; html.dir = lang==='fa' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-i]').forEach(function(e){ e.textContent = t(e.dataset.i); });
    $('lang').textContent = t('other_lang');
    render();
  }
  function applyTheme(){ html.dataset.theme = theme; $('theme').textContent = theme==='dark' ? '☀️' : '🌙'; }
  $('lang').onclick = function(){ lang = lang==='fa'?'en':'fa'; try{localStorage.setItem('sl',lang)}catch(e){} applyLang(); };
  $('theme').onclick = function(){ theme = theme==='dark'?'light':'dark'; try{localStorage.setItem('st',theme)}catch(e){} applyTheme(); };

  function copy(text, btn){
    var done = function(){ btn.textContent=t('copied'); setTimeout(function(){btn.textContent=t('copy')},1600) };
    if(navigator.clipboard) navigator.clipboard.writeText(text).then(done);
    else { var x=document.createElement('textarea'); x.value=text; document.body.appendChild(x); x.select(); document.execCommand('copy'); x.remove(); done(); }
  }
  $('copyBtn').onclick = function(){ copy(url,this) };

  function setLinks(){
    $('support').href = SUPPORT || '#'; $('support').style.display = SUPPORT ? '' : 'none';
    $('h1').href = $('h2').href = $('h3').href = 'hiddify://import/'+url+'#'+encodeURIComponent(USER);
    $('v1').href = 'v2rayng://install-config?url='+encodeURIComponent(url);
    $('s1').href = 'streisand://import/'+url;
  }
  setLinks();

  document.querySelectorAll('.tabs button').forEach(function(b){
    b.onclick = function(){
      document.querySelectorAll('.tabs button,.pane').forEach(function(x){x.classList.remove('on')});
      b.classList.add('on'); $(b.dataset.t).classList.add('on');
    };
  });
  var ua = navigator.userAgent;
  document.querySelector('[data-t="'+(/iPhone|iPad|Mac/.test(ua)?'ios':(/Android/.test(ua)?'and':'pc'))+'"]').click();

  /* ===== لوکیشن‌ها: گروه‌بندی بر اساس کشور ===== */
  function remark(v){
    try{
      if(v.indexOf('vmess://')===0) return JSON.parse(decodeURIComponent(escape(atob(v.slice(8))))).ps || '';
      var i = v.indexOf('#'); return i>-1 ? decodeURIComponent(v.slice(i+1)) : '';
    }catch(e){ return ''; }
  }
  function mk(tag,cls,txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
  function country(code){
    try{ return new Intl.DisplayNames([lang],{type:'region'}).of(code); }catch(e){ return code; }
  }
  function renderLocs(list){
    var box = $('locs'); box.innerHTML = '';
    list = (list||[]).filter(Boolean);
    $('locN').textContent = list.length ? '('+nf(list.length)+')' : '';
    if(!list.length){ box.appendChild(mk('div','grp')).appendChild(mk('div','loc',t('noloc'))); return; }
    var groups = {}, order = [];
    list.forEach(function(v,idx){
      var r = remark(v), m = r.match(/[\u{1F1E6}-\u{1F1FF}]{2}/u), code = '', flag = '🌐';
      if(m){ flag = m[0]; code = Array.from(flag).map(function(c){return String.fromCharCode(c.codePointAt(0)-0x1F1E6+65)}).join(''); }
      var name = (m ? r.replace(m[0],'') : r).replace(/^[\s|\-–]+/,'').trim() || (t('server')+' '+nf(idx+1));
      var k = code || '--';
      if(!groups[k]){ groups[k] = {flag:flag, code:code, items:[]}; order.push(k); }
      groups[k].items.push({v:v,name:name});
    });
    order.forEach(function(k){
      var g = groups[k], d = mk('details','grp'); d.open = true;
      var s = mk('summary'); s.appendChild(mk('span','f',g.flag));
      s.appendChild(mk('span','',g.code ? country(g.code) : t('other')));
      s.appendChild(mk('em','',nf(g.items.length))); d.appendChild(s);
      g.items.forEach(function(it){
        var row = mk('div','loc');
        row.appendChild(mk('span','n',it.name));
        row.appendChild(mk('em','',it.v.split('://')[0].toUpperCase()));
        var q = mk('button','',t('qrbtn')), c = mk('button','',t('copy')), qb = mk('div','lqr'); qb.hidden = true;
        c.onclick = function(){ copy(it.v,c) };
        q.onclick = function(){
          qb.hidden = !qb.hidden;
          if(!qb.hidden && !qb.firstChild){
            try{ new QRCode(qb,{text:it.v,width:200,height:200,correctLevel:QRCode.CorrectLevel.L}); }
            catch(e){ qb.textContent = t('qrfail'); }
          }
        };
        row.appendChild(q); row.appendChild(c);
        var wrap = mk('div'); wrap.appendChild(row); wrap.appendChild(qb); d.appendChild(wrap);
      });
      box.appendChild(d);
    });
  }

  /* ===== اتصال به تنظیمات اشتراک پنل ===== */
  var base = location.pathname.replace(/\/+$/,'');
  function dec(v){
    if(!v) return '';
    if(v.indexOf('base64:')===0){ try{ return decodeURIComponent(escape(atob(v.slice(7)))); }catch(e){ return ''; } }
    return v;
  }
  fetch(base+'/',{headers:{'Accept':'*/*'}}).then(function(r){
    var ti = dec(r.headers.get('profile-title')), su = r.headers.get('support-url'),
        a = dec(r.headers.get('announce')), au = r.headers.get('announce-url');
    if(su) SUPPORT = su;
    if(a){ var n = $('note'); n.textContent = a; if(au) n.href = au; n.hidden = false; }
    setLinks(); render();
  }).catch(function(){});
  function live(){
    fetch(base+'/info').then(function(r){ return r.json(); }).then(function(u){
      S.used = Number(u.used_traffic)||0; S.limit = Number(u.data_limit)||0;
      S.expire = u.expire==null ? '' : String(u.expire);
      if(u.status) S.status = String(u.status).toLowerCase();
      if(u.online_at!==undefined) S.online = u.online_at==null ? '' : String(u.online_at);
      if(u.sub_updated_at!==undefined) S.subupd = u.sub_updated_at==null ? '' : String(u.sub_updated_at);
      if(Array.isArray(u.links)) S.links = u.links;
      render();
    }).catch(function(){});
  }
  setInterval(live, 15000); live();

  applyTheme(); applyLang();
  if(window.QRCode) new QRCode($('qr'),{text:url,width:180,height:180});
})();
</script>
</body>
</html>
